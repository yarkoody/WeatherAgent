[project]
name = "weather-risk-agent"
version = "0.1.0"
description = "Weather Risk Intelligence Agent for logistics hubs"
requires-python = ">=3.12"
dependencies = [
    "ai[openai,typesafe]==0.9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=2.34",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
